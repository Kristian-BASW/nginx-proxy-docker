name: minions-compose

services:
  nginx:
    build: .
    environment:
      API_HOST: "127.0.0.1"
      WEB_HOST: "127.0.0.1"
    ports:
      - "8080:8080"
    depends_on:
      - api
      - web

  api:
    image: <dockerhub-account>/minions-api:latest
    environment:
      ASPNETCORE_HTTP_PORTS: "4000"
    expose:
      - "4000"

  web:
    image: <dockerhub-account>/minions-web:latest
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
